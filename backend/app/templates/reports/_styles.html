<style>
  @page { size: A4; margin: 10mm 8mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    font-size: 9pt;
    color: #111827;
    line-height: 1.4;
    margin: 0;
    padding: 0;
  }
  .landscape { font-size: 7.5pt; }
  .header {
    text-align: center;
    border-bottom: 3px solid #1f4e79;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .title {
    font-size: 16pt;
    font-weight: 800;
    color: #1f4e79;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 9pt;
    color: #6b7280;
    margin: 0;
  }
  .meta-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
    font-size: 8.5pt;
  }
  .meta-table td {
    border: 1px solid #e5e7eb;
    padding: 6px 10px;
    vertical-align: top;
  }
  .meta-table .label {
    width: 22%;
    background: #f8fafc;
    font-weight: 700;
    color: #374151;
  }
  .meta-table .value {
    color: #111827;
  }
  .day-section {
    margin-bottom: 20px;
    page-break-inside: avoid;
  }
  .day-section + .day-section {
    margin-top: 24px;
    padding-top: 4px;
    border-top: 1px dashed #d1d5db;
  }
  .day-header {
    background: #eff6ff;
    border-left: 4px solid #1f4e79;
    padding: 8px 12px;
    font-size: 9.5pt;
    font-weight: 700;
    color: #1f4e79;
    margin-bottom: 10px;
  }
  table.report {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
  }
  table.report thead th {
    background: #1f4e79;
    color: #fff;
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 7px 5px;
    border: 1px solid #1f4e79;
    text-align: center;
    vertical-align: middle;
  }
  table.report tbody td {
    border: 1px solid #e5e7eb;
    padding: 5px 6px;
    vertical-align: middle;
    font-size: 8pt;
  }
  table.report tbody tr:nth-child(even) td {
    background: #f9fafb;
  }
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .text-left { text-align: left; }
  .total-row td {
    background: #e5e7eb !important;
    font-weight: 700;
    border-top: 2px solid #9ca3af !important;
  }
  .empty-msg {
    text-align: center;
    color: #6b7280;
    font-style: italic;
    padding: 24px;
    border: 1px solid #e5e7eb;
    margin-bottom: 12px;
  }
  .footer-note {
    font-size: 7.5pt;
    color: #9ca3af;
    font-style: italic;
    margin-top: 16px;
    line-height: 1.5;
  }
  .variance-up { color: #dc2626; font-weight: 700; }
  .variance-down { color: #059669; font-weight: 700; }
  .nowrap { white-space: nowrap; }
</style>
